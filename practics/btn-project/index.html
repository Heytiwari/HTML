<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bluetooth Toggle</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrap_toggle">

        <label>

            <div class="bluetooth">
                <i class="fa-brands fa-bluetooth-b"></i>
                <span>Bluetooth</span>
            </div>

            <input type="checkbox">

            <div class="switch">
                <div class="knob"></div>
            </div>

        </label>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <i class="bi bi-person"></i>
            <p>User Sign Up</p>
            <form action="" class="user-input-form">
                <div class="input-box">
                    <i class="bi bi-people"></i>
                    <input type="text" placeholder="Name">
                </div>
                <div class="input-box">
                    <i class="bi bi-envelope"></i>
                    <input type="text" placeholder="Email">
                </div>
                <div class="input-box">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" placeholder="Password">
                </div>
                <div class="input-box">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" placeholder="Confirm Password">
                </div>
                <div class="checked">
                    <input type="checkbox">
                    <span>Lorem ipsum dolor sit amet elit. Quasi eum
                        tenetur exercitationem suscipit vel voluptas fuga eveniet. Quasi, ipsum hic?</span>
                </div>
                <button><a href="#">Create Account</a></button>
            </form>
            <span>Already have an account?<a href="../signin/index.html">Signin</a></span>
        </div>
    </div>
</body>

</html>

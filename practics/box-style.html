<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100vh;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 300px;
            height: 350px;
            background-color: #5c5a5a;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        .card::before{
            content: "";
            position: absolute;
            top: -60px;
            bottom: 0;
            width: 300px;
            height: 500px;
            background: conic-gradient(
                transparent,
                transparent,
                transparent,
                #ff007a
            );
            animation: rotate 3s linear infinite;
        }
        .card::after{
            content: "";
            position: absolute;
            inset: 4px;
            background-color: #5c5a5a;
            border-radius: 8px;
        }
        @keyframes rotate {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="card"></div>
</body>
</html>

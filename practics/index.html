<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flash-card {
            width: 100%;
            height: 300px;
        }

        .flash-card1 {
            width: 200px;
            height: 120px;
            background-color: bisque;
            transition: all 1s ease; 
            transform-style: preserve-3d;
            position: relative;
            border-radius: 10px;
        }
        .flash-card1:hover{
            transform: rotateY(180deg);
        }
        .front{
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .back{
            width: 100%;
            height: 100%;
            transform: rotateY(180deg);
            background-color: aqua;
        }
        .front, .back{
            backface-visibility: hidden;
            border-radius: 10px;
            position: absolute;
            text-align: center;
            align-content: center;
            cursor: pointer;
        }
        .button{
            width: 100%;
            height: 200px;
        }
        button{
            padding: 10px 15px;
            border-radius: 50px;
            border: none;
            background-color: black;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        button::before{
            content: "";
            width: 100%;
            height: 100%;
            background-color: blueviolet;
            position: absolute;
            top: 0;
            left: -105px;
            transition: all 1s ease;
        }
        button:hover::before{
            left: 0;
        }
        span{
            color: white;
            position: relative;
        }

    </style>
</head>

<body>
    <div class="flash-card">
        <div class="flash-card1">
            <div class="front">How are you?</div>
            <div class="back">I am fine.</div>
        </div>
    </div>
    <div class="button">
        <button><span>Click me</span></button>
    </div>
</body>

</html>

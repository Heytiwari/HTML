<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .wrapper {
            height: 500px;
            background-color: aqua;
            padding: 10px;
            display: flex;
            flex-flow: column wrap;
        }
        .box{
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: aquamarine;
            margin: 5px;
            text-align: center;
            align-content: center;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
            color: red;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="box">01</div>
        <div class="box">02</div>
        <div class="box">03</div>
        <div class="box">04</div>
    </div>
</body>

</html>

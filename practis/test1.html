<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
    width: 200px;
    height: 200px;
    background: rgb(84, 123, 240);
    transition: transform 1s ease;
    transform-style: preserve-3d;
}

.box:hover{
    background: red;
    transform: rotateY(180deg);
}
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Effect UI Showcase</title>
  <link rel="stylesheet" href="css/style.css" type="text/css" />
</head>

<body>
  <header>
    <h3>Multi-Effect UI Showcase</h3>
    <p>All section styled without Flexbox</p>
  </header>
  <section class="card">
    <h4>Layered Profile Cards</h4>
    <div class="main">
      <div class="card-detail">
        <div class="card-img"></div>
        <h4>Rajan</h4>
        <p>Full Stack Web Developer</p>
      </div>
      <div class="card-detail2">
        <div class="card-img1"></div>
        <h4>Rajan</h4>
        <p>Full Stack Web Developer</p>
      </div>
    </div>
  </section>

  <section class="flash-card">
    <h4>Quiz Flashcard</h4>
    <div class="flash-card1">
      <div class="front">What is HTML?</div>
      <div class="back">HyperText Markup Language</div>
    </div>
    <div class="flash-card2">
      <div class="front">What is CSS?</div>
      <div class="back">Cascading Style Sheets</div>
    </div>
  </section>

  <section class="button">
    <h4>Creative Buttons</h4>
    <button type="submit" class="btn"><span>Slide Button</span></button>
    <button type="submit" class="btn-btn">Glow Button</button>
  </section>
  <section class="card">
    <h4>Intractive Image Gallery</h4>
    <div class="box1">
      <img
        src="https://media.istockphoto.com/id/1341288649/photo/75mpix-panorama-of-beautiful-mount-ama-dablam-in-himalayas-nepal.webp?a=1&b=1&s=612x612&w=0&k=20&c=ZQ4s-_ltnxOs8_hU_ZnPxTnaCNv-gKOImKZok15wekk="
        alt="Natiral" tital="Natiral" />
    </div>
    <div class="box2">
      <img
        src="https://media.istockphoto.com/id/589538028/photo/manali-town.webp?a=1&b=1&s=612x612&w=0&k=20&c=h1LR1HX-PvklWMoGsoeOhtFbcvapy5405z5sgEy9jZM="
        alt="Natiral" tital="Natiral" />
    </div>
    <div class="box3">
      <img
        src="https://media.istockphoto.com/id/2231002213/photo/early-morning-on-tea-plantation-nuwara-eliya-ceylon.webp?a=1&b=1&s=612x612&w=0&k=20&c=6xDLC9aSNtDzOqprCRYgs06BizetQU7IZrRV6_LKnMI="
        alt="Natiral" tital="Natiral" />
    </div>
  </section>
</body>

</html>
